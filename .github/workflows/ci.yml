name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: node --test tools/codegen/model/*.test.mjs tools/conformance/oracle-e-invoice-eu/*.test.mjs tools/conformance/oracle-stackforge-facturx/*.test.mjs tools/license-scan/*.test.mjs

      # T-003 (plan-v0.1 §3.6, release checklist §10): "запрет copyleft в
      # runtime-зависимостях, allow-list в devDependencies" — fails the
      # build the same way a type/lint/test failure would, on a real
      # dependency-license violation (tools/license-scan/scan.mjs).
      - run: pnpm license-scan

      # T-011 / W4 acceptance: regenerating on a clean tree twice must give
      # a zero diff (ADR-002 — determinism, not just "it ran").
      - name: einvoice-model codegen is deterministic
        run: |
          pnpm codegen:model
          git diff --exit-code -- packages/einvoice-model/src/generated

      # T-041/W7: L4 differential oracle against @e-invoice-eu/core (a real
      # third-party generator, devDependency only — M-005/D-17). Fails only
      # on a genuinely new/unreviewed diff shape or a mapping error; the 11
      # fixtures with an already-investigated classification (see
      # docs/l4-oracle-eu-report.md) are expected steady-state, not a
      # failure. Needs no Docker image — pure Node.
      - run: pnpm conformance:oracle-eu
      - name: L4 oracle report is up to date
        run: git diff --exit-code -- docs/l4-oracle-eu-report.md

      # T-042/W7: second L4 differential oracle, @stackforge-eu/factur-x (a
      # different real third-party generator, devDependency only —
      # M-005/D-17). Same gate as T-041: fails only on a genuinely new diff
      # shape; the 12 already-classified fixtures and the 1 documented
      # unmappable fixture (de-line-discount, no BG-27 field in the
      # library's input type) are expected steady-state. Needs no Docker
      # image — pure Node.
      - run: pnpm conformance:oracle-facturx
      - name: L4 factur-x oracle report is up to date
        run: git diff --exit-code -- docs/l4-oracle-facturx-report.md

      # T-032/T-030/W8: the vendored ICC profile's generated TS module is
      # committed, not built on the fly — catches a hand-edit or a
      # re-vendor whose regeneration step was forgotten.
      - name: einvoice-pdfa ICC profile codegen is up to date
        run: |
          pnpm codegen:pdfa
          git diff --exit-code -- packages/einvoice-pdfa/src/generated

  # Spike C (T-044, plan-v0.1 §3.2): proves the Docker validator images
  # build and run the same way in CI as locally, with a machine-readable
  # report. This is a smoke test against a vendored, Apache-2.0 KoSIT test
  # document — not one of our own EN 16931 fixtures (those land in T-050).
  # The full conformance suite (all levels, all fixtures) is T-040/T-004.
  conformance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @normwerk/einvoice-conformance build

      - name: Build validator images
        run: docker compose -f docker/compose.conformance.yml build kosit

      - name: Validate a known-good XRechnung document
        run: |
          pnpm conformance validate \
            packages/einvoice-conformance/src/__fixtures__/kosit-testsuite-01.01a-INVOICE_ubl.xml

  # T-021/W6 acceptance: all 6 base fixtures (fixtures/, T-050), serialized
  # by einvoice-cii, must pass the real KoSIT validator (L1 XSD + L2
  # Schematron, including the XRechnung-profile BR-DE-* rules) — locally
  # and in CI identically (plan-v0.1 §4.5/§9).
  conformance-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @normwerk/einvoice-model build
      - run: pnpm --filter @normwerk/einvoice-cii build
      - run: pnpm --filter @normwerk/einvoice-conformance build

      - name: Build validator images
        run: docker compose -f docker/compose.conformance.yml build kosit mustang

      - run: pnpm conformance:fixtures

      # L5 round-trip (T-043): an independent implementation (Mustang, not
      # KoSIT) re-derives totals from the line items and agrees.
      - run: pnpm conformance:roundtrip

  # T-060/T-061/T-064/W9 acceptance (plan-v0.1 §9): CommerceInvoiceInput ->
  # buildInvoice -> serializeCii must pass the real KoSIT validator too —
  # not just buildInvoice's own unit tests (AGENTS.md §8: never simulate
  # conformance). Separate job/fixture set from conformance-fixtures above
  # (packages/einvoice-commerce/fixtures/, not the root fixtures/, which is
  # strictly Invoice-model-shaped).
  conformance-commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @normwerk/einvoice-model build
      - run: pnpm --filter @normwerk/einvoice-cii build
      - run: pnpm --filter @normwerk/einvoice-commerce build
      - run: pnpm --filter @normwerk/einvoice-conformance build

      - name: Build validator images
        run: docker compose -f docker/compose.conformance.yml build kosit

      - run: pnpm conformance:commerce

  # T-030/W8 acceptance (plan-v0.1): every fixture, embedded into a PDF/A-3b
  # ZUGFeRD/Factur-X document (einvoice-pdfa), must be veraPDF-green (L3),
  # Mustang-extractable byte-for-byte, and pass Mustang's own validate
  # (which also checks the XMP ConformanceLevel/DocumentType/
  # DocumentFileName/Version properties, not just the PDF/A shell).
  conformance-pdfa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @normwerk/einvoice-model build
      - run: pnpm --filter @normwerk/einvoice-cii build
      - run: pnpm --filter @normwerk/einvoice-pdfa build

      - name: Build validator images
        run: docker compose -f docker/compose.conformance.yml build verapdf mustang

      - run: pnpm conformance:pdfa
