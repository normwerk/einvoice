name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # License-scan (T-003) and conformance (Docker-based, T-004) land as
  # their own jobs once those tasks are done (plan-v0.1 §3.6). Until then
  # this workflow only covers what Sprint 0's monorepo scaffold requires.
