name: E2E

# T-078 (plan-e2e.md §7): a real Docker Compose stand — Postgres, Redis, Verdaccio, and a full Medusa v2
# boot — is minutes of work per run and the integration surface it covers (does a real order's data survive
# the trip through a real Medusa instance) changes slowly. Not run on every push/PR like ci.yml; nightly
# catches drift within a day, workflow_dispatch covers "run it now" (before a release, or to check a fix).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Least-privilege default (AGENTS.md §7, same reasoning as ci.yml's own comment): this workflow only reads
# the repo and runs containers locally, it never pushes anything.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `fast` profile only (plan-e2e.md §9's own descope rung 1) — the `fresh` profile
      # (`create-medusa-app@latest`) and a Medusa-version matrix are deferred, tracked separately, not run
      # here yet. `pnpm e2e` itself builds the packages and the two conformance validator images (kosit, verapdf)
      # it needs.
      - run: pnpm e2e

      # One run, one findable output (plan-e2e.md §5 rule 6) — written by the harness's own globalTeardown
      # whether the run passed or failed. `include-hidden-files`: the action skips any path whose own name
      # starts with a dot, the search root `.artifacts` included, so without it nothing is ever uploaded.
      - name: Upload stand logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: e2e/.artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
