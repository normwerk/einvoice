name: Release

# Two separate triggers, deliberately (plan-v0.1 §3 workflow table: `release.yml | tag | changesets → publish
# npm → GitHub release`; P-38):
#
# - A push to `main` only ever runs `changesets/action` *without* a `publish` command: with pending
#   changesets it opens or updates the "Version Packages" PR (`changeset version` bumps versions and writes
#   CHANGELOGs); with none it does nothing. It never publishes. An earlier version passed `publish` here, so
#   any push to `main` with no pending changesets — including the very first one — would have published
#   every public package straight to npm with no test gate and no tag.
# - Pushing a `vX.Y.Z` tag is the one deliberate act that publishes: typecheck, lint, build, test and the
#   license scan must pass first, then `pnpm -r publish` (which publishes every package whose version isn't
#   on npm yet — only each package's own `private` field decides what's publishable; changesets' `ignore`
#   list only affects versioning, not this command), then a GitHub release for the tag.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Open or update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # npm provenance (each package's own `publishConfig.provenance: true`) needs an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm license-scan

      # Every conformance level against the tagged commit, before anything is published: a red level fails
      # this step, so nothing reaches npm; the report it writes is attached to the GitHub release below.
      - name: Build validator images
        run: docker compose -f docker/compose.conformance.yml build kosit mustang verapdf
      - name: Conformance report
        run: node tools/conformance/release-report.mjs conformance-report.md

      # A tag checkout is a detached HEAD, which pnpm's own publish-branch check would reject — the tag
      # itself is the release decision here, so that check is skipped on purpose.
      - name: Publish to npm
        run: pnpm -r publish --no-git-checks
        env:
          # `actions/setup-node`'s `registry-url` writes an `.npmrc` that reads the auth token from
          # `NODE_AUTH_TOKEN` specifically (not `NPM_TOKEN`) — the GitHub secret is still named `NPM_TOKEN`,
          # just exposed under the env var name npm's own tooling actually looks for.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes conformance-report.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
