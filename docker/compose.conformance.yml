# Conformance validators (plan-v0.1 §3.2 spike C / T-044, §8). Each service
# is a standalone CLI tool invoked per file; there is no long-running server.
#
#   docker compose -f docker/compose.conformance.yml run --rm kosit -h /data/<file>.xml
#   docker compose -f docker/compose.conformance.yml run --rm mustang --action validate --source /data/<file>
#   docker compose -f docker/compose.conformance.yml run --rm verapdf --flavour 3b --format json /data/<file>.pdf
#
# `pnpm conformance validate <file>` (packages/einvoice-conformance) wraps
# these and produces one unified machine-readable report.
services:
  kosit:
    build:
      context: ./kosit
    image: einvoice-conformance-kosit:local
    volumes:
      - ${EINVOICE_CONFORMANCE_DATA:-../fixtures}:/data

  mustang:
    build:
      context: ./mustang
    image: einvoice-conformance-mustang:local
    volumes:
      - ${EINVOICE_CONFORMANCE_DATA:-../fixtures}:/data

  verapdf:
    build:
      context: ./verapdf
    image: einvoice-conformance-verapdf:local
    volumes:
      - ${EINVOICE_CONFORMANCE_DATA:-../fixtures}:/data
